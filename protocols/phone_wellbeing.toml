model = "gpt-4o"
quality_control_flagging = false

[consent]
intro_and_consent = "Hi {first_name} — this last bit is a short chat about your phone."

[participant]
require_participant_id = false
editable_participant_id = true
text = ""

[collection]
persona = "You're a friendly researcher talking to a young person aged 11 to 18 about their phone. You are genuinely curious and never in a hurry. You are not worried about their phone use and you are not here to change it. Never give advice about screen time, never suggest they use it more or less, and never imply that any amount is too much."
language_type = "Use short sentences and everyday words — nothing a 12-year-old would have to look up. No jargon, no therapy language, and nothing that sounds like a parent."
intro = "I am going to ask you a few questions about your phone and how it fits into your life, one at a time. There are no right answers and nothing here is marked. Some of it might be good and some of it might not be, and both are just as useful to me. Afterwards I will show you a few short write-ups of what you told me, and you can pick the one that fits best — or tell me what is wrong with it."
questions = [
  "Tell me about your phone — what do you actually use it for most?",
  "Can you tell me about a time recently when your phone made a day better?",
  "And a time when it made a day worse?",
  "How do you usually feel after you have been on it for a long stretch?",
  "If you had to go a week without it, what would you miss most, and what would you not miss at all?",
]
topic_restriction = "Stay on this young person's own experience of their phone and how it affects them. If they raise something else, acknowledge it briefly and return to the questions. Do not give advice, do not suggest changes, and do not comment on how much they use it."

[summaries.questions]
what_they_use_it_for = "What did they say they mainly use their phone for?"
when_it_helps = "What did they describe their phone making better?"
when_it_gets_in_the_way = "What did they describe it making worse?"
how_it_leaves_them_feeling = "How did they say a long stretch on it leaves them feeling?"
what_they_would_miss = "What did they say they would miss, and not miss, without it?"

[summaries.personas]
plain = "You write plainly and briefly, in the first person as 'I', telling it in the order they said it."
feeling = "You lead with how it left you feeling, writing in the first person as 'I', and keep the detail light."
their_words = "You keep the young person's own turns of phrase wherever you can, writing in the first person as 'I'."

[example]
conversation = """
Question: Tell me about your phone — what do you actually use it for most?
Answer: "Mostly talking to my friends, and watching stuff before bed."

Question: And a time when it made a day worse?
Answer: "I stayed up way too late on it and then felt rubbish at school the next day.\""""
scenario = "I mainly use my phone to talk to my friends and to watch things before bed. One night I stayed up much later than I meant to and felt rubbish at school the next day."

[myself]
key = "np.phone_wellbeing"
version = "0.1.0"
name = "Phones and wellbeing (placeholder)"
research_question = "How does this young person describe their relationship with their phone, and what do they say it does to how they feel?"
owner = "faisalmushtaq"
approval_status = "draft"
language = "en-GB"
estimated_minutes = 10
age_min = 11
age_max = 18
permitted_variables = ["first_name"]
permitted_identifiers = []
provider = "openai"
temperature = 0.7
max_output_tokens = 400
timeout_seconds = 30
max_attempts = 3
training_use_opt_out = true
retention_note = "zero-retention endpoint requested"
region = "eu"
outro = "Great, I think I got all I need -- but let me double check!"
select_text = "Here are a few short write-ups of what you told me. Which one fits best?"
select_lede = "None of them will be perfect. Pick the closest and you can fix it next."
rate_text = "How well does that one describe what you told me?"
rate_lede = "0 means it is not you at all. 10 means it is exactly right."
adapt_text = "What would you change about it?"
adapt_lede = "Tell me in your own words and I will rewrite it. What you write here is kept alongside it."
debrief_text = "Thank you, {first_name}. That is everything."
debrief_lede = "What you wrote is stored with the rest of your answers under your secret code. If you want it taken out later, that code is how we find it."
fallback_text = "Thank you — that is really helpful."
max_turns = 14
min_chars = 2
max_chars = 2000
max_chars_per_second = 15
long_message_chars = 250
flag_above_share = 0.3
stop_before_generation = true
offline_fallback = "continue_without_model"
safeguarding_declaration = "No automated safeguarding decisions. Lexicon rules raise a flag for researcher review only; nobody is contacted automatically and nothing is shown to the participant. Participants are told their answers are read by the research team later, and are not monitored as they type."
consent_requirements = ["consent.narrative_ai_assistance", "consent.free_text_storage"]

[myself.character]
name = "Sam"
meaning = "Stories About Me"
look = "neutral"
about = [
  "Sam is an AI, not a person. Nobody is sitting somewhere reading this as you type.",
  "Sam stands for Stories About Me. It asks about your life and then writes back what it heard, so you can say whether it got it right.",
  "It can only read and write. It cannot see you, and it only hears you if you send a recording.",
  "What you say is kept for the research. Your name is not stored with it.",
  "There are no right answers and nothing here is marked.",
]

[[myself.safeguarding]]
key = "distress_lexicon"
kind = "lexicon"
terms = [
  "kill myself",
  "end my life",
  "self harm",
  "self-harm",
  "hurt myself",
  "want to die",
  "suicide",
]
tier = "safeguarding_review"
reviewers = ["principal_investigator"]
disclosure = "What you write here is read by the research team after the session — not while you are typing. If you need to talk to someone now, the last page has the numbers."

[[myself.safeguarding]]
key = "online_harm_lexicon"
kind = "lexicon"
terms = [
  "bullied",
  "bullying",
  "left me out",
  "leaving me out",
  "nasty messages",
  "sent it round",
  "made a fake",
]
tier = "team_notification"
reviewers = ["principal_investigator"]
disclosure = "What you write here is read by the research team after the session — not while you are typing. If you need to talk to someone now, the last page has the numbers."
