name: "Studio: study space housekeeping"

# Run by hand from main (apps/functions/studio-ops.mjs):
#   questions     a survey's questions (draft, live, archived), read-only
#   list          every study space, its surveys, sections and (masked) members
#   grant-owners  everyone on a study space's Studio list: Studio admin there,
#                 the project owner role and the dashboard's access list
#   insert        library questionnaires or modules into a survey's draft
#   remove-blocks whole questionnaires out of a draft (archived, restorable)
#   reorder       a section's questions in a given order
#   add-option    an answer option on a question, with a new code
#   set-lede      a question's instructions (the line under it)
#   set-text      a question's wording (field stem) or instructions (field lede)
#   add-info      an information screen (title, text), after a question or first
#   set-screen    the finish (or review) screen's text (item = finish)
#   glossary      a word participants can tap for its meaning (label = word, text = meaning)
#   archive       single questions out of a draft (restorable)
#   restore       archived questions back where they were
#   dob-ages      the ages a survey's date of birth accepts
#   retitle       a survey's title; form-label  a questionnaire's form label
# Without "apply" it is a dry run. Drafts are saved, never published. The
# repository is public, so are these logs: emails are printed masked.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to do"
        type: choice
        options: [list, questions, grant-owners, insert, remove-blocks, archive, restore, reorder, add-option, set-lede, set-text, add-info, glossary, set-screen, dob-ages, retitle, form-label]
        default: list
      study:
        description: "Study space id (from list)"
        type: string
        default: ""
      survey:
        description: "Survey id (insert, dob-ages)"
        type: string
        default: ""
      section:
        description: "Section key to insert into (insert; blank with replace)"
        type: string
        default: ""
      after:
        description: "Question ID to insert after (insert; blank = end of the section)"
        type: string
        default: ""
      pieces:
        description: "Comma-separated: questionnaire references (phq4@1.0/en-GB/self/standard) or module keys (insert)"
        type: string
        default: ""
      replace:
        description: "Questionnaire to replace, by key, e.g. macarthur_ssy (insert)"
        type: string
        default: ""
      min_age:
        description: "Youngest age (dob-ages)"
        type: string
        default: ""
      max_age:
        description: "Oldest age (dob-ages)"
        type: string
        default: ""
      order:
        description: "Question IDs in order, comma-separated (reorder)"
        type: string
        default: ""
      match:
        description: "Only questions whose ID, variable or wording contains this (questions)"
        type: string
        default: ""
      field:
        description: "stem or lede (set-text)"
        type: string
        default: ""
      text:
        description: "New text (set-lede, set-text, add-info); the meaning (glossary)"
        type: string
        default: ""
      items:
        description: "Question IDs, comma-separated (archive, restore)"
        type: string
        default: ""
      item:
        description: "Question ID (add-option)"
        type: string
        default: ""
      append:
        description: "Add the text as a new paragraph after what is there (set-text, set-screen)"
        type: boolean
        default: false
      first:
        description: "Show the new option first (add-option)"
        type: boolean
        default: false
      title:
        description: "New survey title (retitle); screen heading (add-info)"
        type: string
        default: ""
      instruments:
        description: "Questionnaire keys, comma-separated (remove-blocks)"
        type: string
        default: ""
      instrument:
        description: "Questionnaire key (form-label)"
        type: string
        default: ""
      label:
        description: "New form label (form-label); the word (glossary); an option label (add-option)"
        type: string
        default: ""
      apply:
        description: "Make the change (otherwise a dry run)"
        type: boolean
        default: false

concurrency:
  group: studio-ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    if: github.repository == 'faisalmushtaq/MySelf' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Authenticate
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::No FIREBASE_SERVICE_ACCOUNT secret (docs/13-firebase.md section 5.2.1)."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Run
        working-directory: apps/functions
        env:
          COMMAND: ${{ inputs.command }}
          STUDY: ${{ inputs.study }}
          SURVEY: ${{ inputs.survey }}
          SECTION: ${{ inputs.section }}
          AFTER: ${{ inputs.after }}
          PIECES: ${{ inputs.pieces }}
          REPLACE: ${{ inputs.replace }}
          MIN_AGE: ${{ inputs.min_age }}
          MAX_AGE: ${{ inputs.max_age }}
          ORDER: ${{ inputs.order }}
          MATCH: ${{ inputs.match }}
          TITLE: ${{ inputs.title }}
          ITEMS: ${{ inputs.items }}
          ITEM: ${{ inputs.item }}
          TEXT: ${{ inputs.text }}
          FIELD: ${{ inputs.field }}
          FIRST: ${{ inputs.first && '--first' || '' }}
          APPEND: ${{ inputs.append && '--append' || '' }}
          INSTRUMENTS: ${{ inputs.instruments }}
          INSTRUMENT: ${{ inputs.instrument }}
          LABEL: ${{ inputs.label }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: |
          node studio-ops.mjs "$COMMAND" --project myself-research \
            ${STUDY:+--study "$STUDY"} ${SURVEY:+--survey "$SURVEY"} ${SECTION:+--section "$SECTION"} \
            ${AFTER:+--after "$AFTER"} ${PIECES:+--pieces "$PIECES"} ${REPLACE:+--replace "$REPLACE"} ${MIN_AGE:+--min-age "$MIN_AGE"} ${MAX_AGE:+--max-age "$MAX_AGE"} \
            ${ORDER:+--order "$ORDER"} ${MATCH:+--match "$MATCH"} ${TITLE:+--title "$TITLE"} ${ITEMS:+--items "$ITEMS"} ${ITEM:+--item "$ITEM"} ${TEXT:+--text "$TEXT"} ${FIELD:+--field "$FIELD"} $FIRST $APPEND ${INSTRUMENTS:+--instruments "$INSTRUMENTS"} ${INSTRUMENT:+--instrument "$INSTRUMENT"} ${LABEL:+--label "$LABEL"} $APPLY

      - name: Shred the credential
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
