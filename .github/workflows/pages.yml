name: Deploy participant preview to GitHub Pages

# ONE BRANCH, because this publishes to the URL an iPad in a school hall loads.
# It used to deploy from a long-lived feature branch as well, so whichever
# pushed last was what a device picked up, with nothing on screen to say which.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Firebase web config is a set of PUBLIC identifiers — the apiKey
      # names a project, it does not authorise anything. What authorises is a
      # signed-in account carrying a role an owner granted, or the `device`
      # claim on an enrolled iPad, both checked server-side. It is here rather
      # than in a secret because it ships inside the built JavaScript either
      # way, and pretending otherwise would be theatre.
      #
      # THE PARTICIPANT APP GETS IT TOO, so one build serves both the public
      # preview and a fielded iPad. Which one it is depends on enrolment, not on
      # the build: an unenrolled device stores everything locally and sends
      # nothing anywhere, and only an owner can mint the token that enrols one.
      # A visitor to the public URL therefore gets the survey and no route into
      # the study, which is what the preview has always been.
      - run: pnpm -r build
        env:
          MYSELF_FIREBASE_CONFIG: >-
            {"apiKey":"AIzaSyCqcaFWJMobljhX63s--l4NEPZV6IXWJvM",
             "authDomain":"myself-research.firebaseapp.com",
             "projectId":"myself-research"}
      # After the build, because it reads the service worker the build emits:
      # a preview server has none, which is how /researcher/ shipped broken twice.
      - run: pnpm -r test
      # Both apps ship from one artifact: the participant app at the root, the
      # researcher view one level down. Separate paths keep the participant
      # app's service worker out of the researcher view's scope — a shared
      # scope would have the survey's cache serving the wrong build.
      - run: cp -R apps/researcher/dist apps/participant/dist/researcher
      # MyStory, static: it runs the narrative protocols in the page against
      # the deterministic mock, so it needs no server and no key.
      - run: cp -R apps/mystory-lab/dist apps/participant/dist/mystory
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/participant/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
