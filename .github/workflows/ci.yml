name: CI

# Actions minutes are limited, and a full run bills about 64 of them across six
# jobs (37 of those in e2e), so the suite is spent where it earns its keep:
#
#   pull request  every job, but e2e drives WebKit only (the engine an iPad
#                 runs, which is where this app's hard cases live). Draft pull
#                 requests run nothing until they are marked ready for review.
#   main          the merge repeats only `test` and `e2e` (both engines).
#                 rules, integration, sync and studio already passed on the
#                 pull request and are not run again for the same code.
#   by hand       workflow_dispatch from the Actions tab runs every job with
#                 both engines, for a branch that needs it without a PR.
#
# A newer push cancels the run it supersedes. A change only to docs or to the
# deploy workflows is skipped: nothing here runs them.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".github/workflows/firebase.yml", ".github/workflows/pages.yml", ".github/workflows/preview.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md", ".github/workflows/firebase.yml", ".github/workflows/pages.yml", ".github/workflows/preview.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # Everything above is a unit test, and they stop where the risk starts: the
  # screens a child touches, the real IndexedDB, the AES round trip through it,
  # the service worker, and resuming a sitting after a reload. This walks the
  # whole questionnaire in a real browser and hands it over as a file.
  #
  # WEBKIT IS THE ONE THAT MATTERS — an iPad runs it, and this app's hard cases
  # are Safari's storage and service-worker behaviour. A pull request runs only
  # WebKit, which halves the job; main and a manual run add Chromium too.
  e2e:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workspace packages first. The participant app imports `@myself/store`
      # through its `dist`, and so does the accuracy spec — without this the
      # build inside Playwright's webServer fails before a browser has started,
      # and a WebKit job that never reaches WebKit tells nobody anything. Every
      # other job here already does it; this one was written without it.
      - run: pnpm -r build
      - run: pnpm exec playwright install --with-deps ${{ github.event_name == 'pull_request' && 'webkit' || 'chromium webkit' }}
      - run: pnpm test:e2e ${{ github.event_name == 'pull_request' && '--project=webkit' || '' }}
      # The trace is the only way to see what a failed walk actually did, and a
      # run that fails without one costs a second run to find out.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # The write path against a real Firestore. The unit suite runs it against a
  # stand-in, which cannot have real transaction contention — and the promise this
  # platform makes is that two iPads handed over at the same instant cannot
  # overwrite each other. Only a database can prove that.
  integration:
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @myself/functions test:integration

  # The whole chain: a real browser, over HTTP, into a real Firestore. Every other
  # suite stops at a seam — shapes agree, the write path keeps devices apart, the app
  # collects and resumes — and this is the one that puts a real request on a socket in
  # front of the real handler and then reads the sitting back out of the database.
  sync:
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:sync
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sync-trace
          path: test-results/
          retention-days: 7

  # MySelf Studio, the whole loop (docs/16 §9): sign in, edit, be stopped by
  # validation, fix, preview, publish through the real studioPublish, then the
  # public survey loads the new version and a sitting on it is filed stamped
  # with it — while a sitting recorded earlier stays exactly as it was. Auth,
  # Firestore and Functions all run as emulators, so nothing between the
  # browser and the database is mocked.
  studio:
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:studio
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: studio-trace
          path: test-results/
          retention-days: 7

  # Security rules are the access control on Firebase, so an untested rules
  # change is an untested security change. This runs them against the real
  # Firestore emulator, from both sides of every rule.
  rules:
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: infra/firebase/test
      - run: npm test
        working-directory: infra/firebase/test
