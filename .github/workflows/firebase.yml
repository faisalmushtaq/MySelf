name: Deploy to Firebase

# Firebase Hosting and the functions do not redeploy themselves the way GitHub
# Pages does, so without this the two halves of the platform drift: the public
# preview would carry a change and the signed-in site would not, with nothing
# on screen to say so except a build stamp somebody has to notice.
#
# Hosting goes on every push to main — it is static files, and a bad one is
# undone by the next push. FUNCTIONS ONLY GO WHEN FUNCTION CODE CHANGED. A
# backend redeploy has a cold-start cost and a window where the relay is
# replaced, and doing that because somebody edited a document is not free.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      functions:
        description: "Deploy the functions as well"
        type: boolean
        default: false

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without the key there is nothing to authenticate with, and a run that
    # fails for that reason on every push is noise nobody reads.
    if: github.repository == 'faisalmushtaq/MySelf'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # The same suite that guards the Pages deploy. A backend that fails its
      # tests should not reach a study.
      - run: pnpm -r test

      - name: Did anything the functions depend on change?
        id: changed
        run: |
          if [ "${{ inputs.functions }}" = "true" ]; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -qE '^(apps/functions/|packages/(llm|narrative|firebase|schema|store)/|releases/|infra/firebase/(firebase\.json|firestore\.rules|storage\.rules))'; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
          fi

          # Rules are their own deploy target and were never one.
          #
          # They were in the filter above, which only ever meant "redeploy the
          # functions" — so an edit to firestore.rules or storage.rules landed
          # on main, went green, and changed nothing in the project. A rules
          # file that is not deployed is a security control that exists only in
          # the repository, and the gap is invisible precisely because the run
          # passes.
          if git diff --name-only HEAD^ HEAD | grep -qE '^infra/firebase/(firestore\.rules|firestore\.indexes\.json|storage\.rules)'; then
            echo "rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "rules=false" >> "$GITHUB_OUTPUT"
          fi

      # The credential arrives through the environment rather than being
      # substituted into the script text. A JSON blob pasted inside quotes in a
      # shell line only has to contain one apostrophe to break out of them, and
      # a key is not a thing to be casual about.
      #
      # Checked before use, because the Firebase CLI's own answer to a missing
      # credential is "have you run firebase login?" — which is true of a laptop
      # and meaningless on a runner, and sends whoever reads it looking for the
      # wrong thing entirely.
      - name: Authenticate
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::No FIREBASE_SERVICE_ACCOUNT secret. Firebase console -> Project settings -> Service accounts -> Generate new private key, then paste the whole JSON file into this repository under Settings -> Secrets and variables -> Actions, named FIREBASE_SERVICE_ACCOUNT. Delete the downloaded file afterwards. See docs/13-firebase.md section 5.2.1."
            exit 1
          fi

          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

          # Says which account is being used and for which project. Pasting the
          # key for the wrong project, or pasting something that is not a
          # service account key at all, otherwise surfaces much later as a
          # permission error against a project nobody meant to touch.
          node -e '
            const fs = require("node:fs");
            let key;
            try {
              key = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/sa.json", "utf8"));
            } catch {
              console.log("::error::The FIREBASE_SERVICE_ACCOUNT secret is not valid JSON. It should be the entire contents of the downloaded key file, opening brace to closing brace.");
              process.exit(1);
            }
            if (key.type !== "service_account" || !key.client_email) {
              console.log("::error::The FIREBASE_SERVICE_ACCOUNT secret is JSON, but not a service account key. Generate one under Firebase console -> Project settings -> Service accounts.");
              process.exit(1);
            }
            if (key.project_id !== "myself-research") {
              console.log(`::error::That key is for ${key.project_id}, and this workflow deploys myself-research. Generate the key from the myself-research project.`);
              process.exit(1);
            }
            console.log(`Deploying to ${key.project_id} as ${key.client_email}`);
          '

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - run: npm i -g firebase-tools@15

      - name: Deploy hosting
        working-directory: infra/firebase
        run: firebase deploy --only hosting --project myself-research --non-interactive

      # Before the functions, deliberately: if a new function reads or writes
      # something the rules must permit, the permission should already be in
      # place when it starts serving.
      - name: Deploy Firestore rules
        if: steps.changed.outputs.rules == 'true'
        working-directory: infra/firebase
        run: |
          if ! firebase deploy --only firestore:rules,firestore:indexes --project myself-research --non-interactive; then
            echo "::error::Firestore rules could not be deployed. A 403 from firebaserules.googleapis.com means the deploy service account is missing the Firebase Rules Admin role (roles/firebaserules.admin) — grant it in the Google Cloud console under IAM and Admin -> IAM, on the principal this workflow authenticates as."
            exit 1
          fi

      # Its own step, because Storage is the one product here that has to be
      # switched on by hand before anything can be deployed to it — and when it
      # has not been, the CLI's answer is a permissions error about an API,
      # which reads like a broken service account rather than a bucket that was
      # never created. Bundled with Firestore, that failure took the rules that
      # WOULD have deployed down with it.
      - name: Deploy Storage rules
        if: always() && steps.changed.outputs.rules == 'true'
        working-directory: infra/firebase
        run: |
          if ! firebase deploy --only storage --project myself-research --non-interactive; then
            echo "::error::Storage rules could not be deployed. A 403 from firebaserules.googleapis.com means the deploy service account is missing the Firebase Rules Admin role — grant it in the Google Cloud console under IAM. If instead the log says firebasestorage.googleapis.com is missing, the project has no Storage bucket yet: Firebase console -> Build -> Storage -> Get started, europe-west2."
            exit 1
          fi

      # `always()`, so a rules problem does not hold back a code fix.
      #
      # Rules still go first, and the job still fails when they fail — but the
      # first time they failed they took the functions deploy down with them,
      # and the change being blocked was the one that fixed where recordings
      # are written. A permission missing on one API is no reason to stop
      # shipping the other half.
      - name: Deploy functions
        if: always() && steps.changed.outputs.functions == 'true'
        working-directory: infra/firebase
        run: firebase deploy --only functions --project myself-research --non-interactive

      # The credential is a key to the whole project and has no business
      # outliving the job that used it.
      - name: Shred the credential
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
