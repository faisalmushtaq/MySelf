# MySelf — Phase 0 decision register
# Recorded 2026-08-02 from the principal researcher's in-session answers.
# Dispositions: EXACT | PRESENT | SAFE-FIX | APPROVED-FIX | DEPART | UNRESOLVED
# This file is part of release provenance: releases reference the decision IDs they implement.

decisions:
  - id: D-01
    anomaly: A-1
    topic: Abstaining_SM question text is wrong (duplicates app_reduce)
    decision: fix-in-r1
    disposition: APPROVED-FIX
    detail: >
      Restore the intended wording ("What effect do you think abstaining from
      social media would have on you?") as a new item version of
      sm_abstain_effect. Exact final wording to be confirmed at library review.
      Legacy Qualtrics variable flagged unreliable in the crosswalk.

  - id: D-02
    anomaly: A-2
    topic: Twitch row of TimeSpent matrix tests the X (Twitter) condition
    decision: fix-in-r1
    disposition: APPROVED-FIX
    detail: >
      Twitch row displays when Twitch is in "I have these apps on my phone".
      Legacy Twitch-time data annotated unreliable in the crosswalk.

  - id: D-03
    anomaly: A-3
    topic: other_games display logic inverted (shown only to non-gamers)
    decision: fix-in-r1
    disposition: APPROVED-FIX
    detail: >
      Games list and follow-up time matrix shown when "I do not play video
      games" is NOT selected. Includes the A-4 residual fix: the time matrix
      displays when ANY game slot is non-empty (not only slot 1).
      Legacy data annotated accordingly.

  - id: D-04
    anomaly: A-43
    topic: Age-of-adoption dropdowns missing option "5"
    decision: fix-in-r1
    disposition: APPROVED-FIX
    detail: >
      Insert age "5" into smartphone_age and sm_age with clean canonical codes;
      crosswalk documents that legacy data cannot contain this value.

  - id: D-05
    anomaly: A-44
    topic: RCADS/SDQ forced response contradicts "you can skip it" instruction
    decision: soft-required-with-decline
    disposition: APPROVED-FIX
    detail: >
      RCADS-25 and SDQ items are soft-required in r1 (single prompt, then
      skippable/declinable), honouring the participant-facing instruction.
      Departure from Qualtrics ForceResponse configuration is documented.

  - id: D-06
    anomaly: A-5
    topic: Consent has no decline pathway
    decision: keep-forced-consent
    disposition: EXACT
    detail: >
      All six consent statements remain required with no in-app decline path;
      non-consent is handled off-platform by the research team, as now.

  - id: D-07
    anomaly: A-34 (and A-28, A-33)
    topic: Typos in bespoke item wording and instructions
    decision: fix-in-r1
    disposition: APPROVED-FIX
    detail: >
      Bespoke item typos ("mental welling", "wellbeing in mostly negative",
      "did you you get", "Ethic origin", "haven not / pleas") corrected as new
      item versions; originals preserved in migration metadata.

  - id: D-08
    anomaly: A-6, A-7, A-8, A-19, A-20 (validated-form deviations)
    topic: Comparability stance for validated instruments in r1
    decision: adopt-canonical-now
    disposition: DEPART
    detail: >
      Release 1 administers corrected canonical forms (SDQ canonical anchors and
      single-edition wording, KSS canonical labels, EHI-SF canonical anchors,
      MacArthur discrete 10-rung ladder), accepting a documented comparability
      break with the Qualtrics wave. As-administered -ybm-asadmin forms are
      still encoded in the library for legacy-data interpretation.
    constraints:
      - SDQ canonical inclusion remains gated on youthinmind authorisation (A-25).
      - Canonical wording must be verified against publisher/author sources
        before encoding; verification status recorded per instrument.

  - id: D-09
    anomaly: A-26, A-27
    topic: Identifier collection
    decision: keep-current-collection
    disposition: EXACT (collection) / DEPART (storage)
    detail: >
      The participant flow continues to collect first name, last name, DoB,
      ps_id components and val_id. Architectural separation is retained:
      identity fields are routed to the separated identity schema, role-gated,
      excluded from default exports, and never stored beside response data.

  - id: D-10
    anomaly: A-24, A-25, A-21, A-23, A-42
    topic: Licensing conversations (SDQ, SWEMWBS, STAI-5, doomscrolling, hair chart, micro-narratives citation/courtesy)
    decision: research-team-handles
    detail: >
      The research team runs all licensor conversations. The platform tracks
      licence status per instrument; the publish gate continues to block
      permission_required/blocked instruments.
      Updated 2026-08-02: the researcher confirmed in-session that licences and
      ethics approvals are held. Instrument records move to permission_held on
      this attestation; `verified` stays false until the licence documents are
      filed in the register (paperwork task, not a publish blocker).
    status: researcher-attested-held

  - id: D-11
    anomaly: A-29
    topic: Safeguarding configuration
    decision: defer-rules-build-mechanism
    detail: >
      Updated 2026-08-02: no existing safeguarding protocol document exists yet;
      the researcher will develop one later. The platform builds the full flag
      mechanism (tiers, review queue, permission gating, audit) but ships with
      no active rules. The publish gate requires an explicit safeguarding
      declaration per narrative protocol — "no automated rules; researcher
      review only" is a valid, deliberate declaration for early releases, and
      participant-facing wording must not imply any monitoring.
    status: deferred-by-researcher

  - id: D-12
    topic: Hosting and researcher identity provider
    decision: cloud-when-provisioned
    detail: >
      Updated 2026-08-02: no cloud account exists yet. The MVP runs on Docker
      Compose (Postgres + API + apps) so it works locally and moves unchanged
      to any provider once an account is set up. Recommendation prepared for
      that moment: AWS eu-west-2 or Azure UK South (UK data residency),
      managed Postgres, object storage for assets/exports; researcher sign-in
      via Keycloak initially, swappable for the university IdP (OIDC) later.
    status: deferred-until-account-exists

  - id: D-13
    topic: Collection-device posture
    decision: team-controlled-no-mdm
    detail: >
      iPads are physically controlled by the research team but not MDM-managed.
      Consequences applied: app-layer encryption treated as the primary at-rest
      control; device-passcode presence checked and surfaced on the readiness
      screen; provisioning runbook requires passcode + Home-Screen install;
      residual risk recorded in the risk register.

  - id: D-14
    topic: LLM provider for the first narrative study
    decision: openai-first-provider-flexible
    detail: >
      OpenAI adapter implemented first (existing API usage carries over);
      the provider-independent gateway and deterministic mock are retained, and
      provider/model/params are pinned per published release so other providers
      can be adopted per study without code changes.

  - id: D-15
    topic: MVP narrative scope
    decision: full-protocol-only
    detail: >
      The MVP's narrative module is the full micro-narrative protocol
      (guided collect -> extraction -> persona scenarios -> select -> rate ->
      adapt -> confirm), generalised from the CHI 2025 app. np.future_self is
      not built as a protocol; the Future Self question remains a plain
      open-text item in the YBM questionnaire.

  - id: D-16
    topic: Product naming — separating surveys from LLM narratives
    decision: mythoughts-and-mystory
    detail: >
      Researcher decision 2026-08-02: within the MySelf platform, the two
      participant-facing experiences are named and visually separated —
      "MyThoughts" for conventional questionnaire/survey modules and
      "MyStory" for LLM-supported micro-narrative protocols. MySelf remains
      the platform and umbrella brand; the composer tags each assessment
      component as a MyThoughts or MyStory experience; participant screens
      show the sub-brand of the active experience so participants always know
      whether they are answering questions or telling a story (this also
      reinforces the design rule that model-mediated interaction must be
      distinguishable from the canonical survey engine).

  - id: D-17
    topic: Visual and interaction style system
    decision: brainpop-editorial-plus-conversational-survey
    detail: >
      Researcher decision 2026-08-02: MySelf adopts the BrainPop lab website's
      editorial visual language (cream #FAF6F0 canvas, Newsreader display
      serif, DM Sans body, green #067843 accent, hairline borders, restrained
      motion) applied to conversational-survey interaction patterns
      (one question per screen, lettered option keys with keyboard parity,
      auto-advance, segmented progress). Documented in docs/11-style-guide.md,
      which is binding for the participant app, MySelf Studio and all future
      surfaces. Fonts are bundled locally (@fontsource) rather than loaded from
      a CDN so the interface renders identically offline.

  - id: D-18
    topic: Presentation of hair type and the MacArthur ladders; public preview content
    decision: intuitive-controls-and-unredacted-preview
    detail: >
      Researcher direction 2026-08-02. (a) Hair type is presented as a grid of
      tappable tiles, each drawing its own curl pattern as MySelf-authored SVG
      artwork — this removes the dependency on the third-party Qualtrics chart
      image entirely (closing the A-42 hair-chart licence question by not using
      the asset). (b) The MacArthur ladders are drawn ladders the participant
      taps or drags directly, with anchor labels at each end, replacing the
      abstract slider; the SPARQ background image is likewise no longer needed.
      (c) The researcher confirmed the instrument licences are held (extracted
      for the existing Qualtrics survey), so the public preview build no longer
      redacts validated-instrument wording. Item wording, options and response
      codes are unchanged; these are presentation changes, released as r2.0.0
      because anything participant-visible requires a new immutable release
      (r1.0.0 remains in the repository untouched).

  - id: D-19
    topic: Response-effort safeguards, validation, and intuitive handedness
    decision: friction-validation-and-spatial-controls
    detail: >
      Researcher direction 2026-08-02.
      (a) SKIP FRICTION: pressing Next on an unanswered skippable item now asks
      "Leave this one blank?" in a reserved footer strip — the question above it
      never moves. The prominent action is "I'll answer it"; "Skip" is the
      quiet one. Skipping stays possible for anyone who means it.
      (b) SKIP RUN CHECK-IN: after `effort.skipRunCheckIn` consecutive skips
      (default 3) a full screen offers to return to the first question of the
      run. Both the prompt and the choice are recorded as paradata
      (skip.confirmed / skip.abandoned / effort.checkin_shown /
      effort.checkin_returned).
      (c) DWELL HELP: after `effort.dwellHintSeconds` on one item (default 30)
      a quiet "Need a hand with this one?" appears, revealing the item hint and
      the instrument instructions that framed it — the context a participant
      may have forgotten several screens ago. Recorded as hint.shown with the
      reason, giving a response-time data-quality signal.
      (d) VALIDATION: participant code, the ps_id components and the validation
      ID carry anchored patterns with plain-language hints; date of birth is
      checked for plausibility (minAgeYears 4, maxAgeYears 100, no future
      dates). All are configured in the release manifest, not hard-coded.
      (e) HANDEDNESS: EHI items are presented as a left-to-right spatial
      spectrum (Always left … Always right) with a drawing of the object, so
      the layout carries the meaning. The canonical form lists options
      right-first, so it sets spectrumReverse — display order only, response
      codes unchanged.
      Released as r3.0.0 (participant-visible presentation change).

  - id: D-20
    topic: Age-adaptive assessments
    decision: planned-next
    detail: >
      The researcher confirmed assessments will eventually be adaptive —
      different item sets by age group and other participant characteristics.
      Nothing in the current design blocks this: the logic AST already gates
      sections, components and items on prior answers; instruments carry
      age ranges and reading-level forms; and the composition carries an age
      band. What is still needed, and is scheduled rather than half-built:
      (1) participant attributes (age/school year) available as logic operands
      alongside item answers, (2) composer UI for age-banded branches with a
      coverage check, (3) publish-gate validation that every age band reaches a
      complete, scorable set, and (4) export metadata recording which branch a
      participant received. To be designed with the researcher before build.

  - id: D-21
    topic: Single typeface, Enter-to-advance, and the accessible-font hook
    decision: one-typeface-and-keyboard-parity
    detail: >
      Researcher direction 2026-08-02.
      (a) TYPOGRAPHY: the serif/sans pairing is dropped — the whole interface
      is set in one typeface (DM Sans) so nothing changes voice mid-question.
      Hierarchy is carried by size and weight alone. The family is named in a
      single custom property (--font-ui), which --font-display and --font-body
      alias, so switching to a dyslexia-friendly face (Atkinson Hyperlegible,
      OpenDyslexic) is a one-line change or a per-participant body-class
      toggle, with no component edits. The accessible-font option itself is
      planned, not yet built.
      (b) ENTER ADVANCES: pressing Enter on a typed answer moves to the next
      screen, matching the auto-advance behaviour of choice questions. In a
      multi-field form Enter walks down the fields and advances from the last.
      Long-form narrative text keeps Enter for line breaks. The handler routes
      through the same disabled-state check as the Next button, so it can
      never bypass a validation error.

  - id: D-22
    topic: Entry hardening — invalid values are prevented, not just flagged
    decision: prevent-at-the-control
    detail: >
      Researcher direction 2026-08-02, after implausible identifiers and a
      future date of birth were still accepted on the deployed preview.
      The principle adopted is prevention over correction: a field that cannot
      hold a value must not accept it in the first place, and a message is the
      backstop rather than the mechanism.
      (a) LENGTH: every text and form field truncates in JavaScript on commit,
      not only via the maxLength attribute. Platform AutoFill and predictive
      keyboards write the value programmatically, and that path ignores
      maxLength entirely — reproduced in the browser with a six-character name
      landing in a two-character field.
      (b) CHARACTER CLASS: numeric fields strip non-digits as they are typed or
      pasted, so letters never appear at all. type="number" is not used
      anywhere: it ignores maxLength, accepts "e", "+" and "-", and reports an
      empty value for text the participant can still see. Fields are
      type="text" with inputMode driving the on-screen keyboard.
      (c) DATE BOUNDS: the date input carries min/max computed from
      minAgeYears/maxAgeYears, so the native picker cannot offer a future date
      or an implausible age; the plausibility check remains as the backstop for
      typed entry.
      (d) PARTICIPANT CODE: punctuation and spaces are dropped and letters
      upper-cased as the code is typed, before the pattern is applied.
      (e) SCREEN TRUTH: once a control reports on itself, what is on screen
      governs whether the participant may advance — a complete entry counts
      immediately (no waiting out the autosave debounce), and clearing a field
      back to blank stops counting even though an earlier value was recorded.
      Emptying a skippable field advances as a skip, so the raw data matches
      what was left on screen.
      (f) BUILD VISIBILITY: the service worker force-updates and reloads on
      controllerchange, and the start screen shows the build stamp, so a cached
      build can no longer make a shipped fix look absent.
      Released as r3.1.0 (validation configuration is participant-visible).

  - id: D-23
    topic: Entry flow, presentation of long option lists, and granular timing
    decision: staged-entry-open-options-and-full-paradata
    detail: >
      Researcher direction 2026-08-02, from walking the deployed preview.
      (a) OPENING SCREEN: the code the research team issues is entered once, on
      the first screen, with instructions saying where it comes from and what
      to do without one. Format is three letters and four digits. The in-flow
      "validation ID" question is removed as redundant — it was asking again
      for something already given, and the second attempt is the one that gets
      mistyped. The code is stored against `val_id`, so the legacy variable is
      still populated without anyone retyping it.
      (b) SECRET CODE IN STAGES: the four ps_id components are now four screens,
      each with one instruction and its own validation, preceded by a screen
      explaining what the code is for: it lets the participant recover or
      withdraw their data, and the team cannot reverse it. Birth month is
      chosen from a list of twelve rather than typed, so it cannot be mistyped
      at all. Legacy ps_id is derived from the four components at export.
      (c) OPTIONS OVER MENUS: dropdowns are gone wherever the list can be laid
      out. Four-, five- and nine-band scales are cards; ages and months are
      compact chips; the twenty census ethnicity categories are a full tappable
      list. The presentation is now decided in the library per item — the
      app no longer falls back to a menu on option count.
      (d) LADDERS: each MacArthur ladder shares one screen with its
      explanation. The two click-through pages that preceded each are removed,
      and "imagine that the ladder below…" is rewritten, since there was no
      ladder on that screen. Selecting a rung advances on release, like tapping
      a card; dragging up and down does not jump the screen mid-decision.
      (e) NARRATION: every stem and instruction was audited for wording written
      for a paper form — "below are some statements", "the information
      presented above". Where a screen tells the participant to read something
      that is not on it, the wording is wrong, and a test now fails on the
      pattern. Instrument instructions keep their substance; only the
      delivery-specific words change. The mid-battery reminder shows the last
      sentence of the instructions — the part that says how to answer — rather
      than the opening sentence describing what is coming.
      (f) HAIR TYPES: the 1a-4c classification codes are no longer shown.
      Participants match a picture and a plain description; the code moves to
      the scale's `codeLabel` for the codebook.
      (g) SKIP CONFIRMATION: "Skip" moves to the quiet left position where Next
      was, and "I'll answer it" takes the prominent right-hand one, so the tap
      that opened the strip cannot land on Skip.
      (h) BACK: an explicit grey "Back" beside the arrow. A bare chevron in a
      corner was missed by people who wanted to change an answer.
      (i) TIMING PARADATA: every viewing of every item is opened and closed in
      the event log, carrying visit number and dwell. Total time, time in the
      foreground, time to first response, revisits and answer changes are all
      reconstructable from the log alone. The app being backgrounded is
      recorded and stops the clock, so an iPad left on a desk does not read as
      deliberation.
      (j) TOO-FAST ANSWERS: an answer given in under two seconds is flagged in
      the paradata (`response.too_fast`). The answer is always kept — the raw
      data is never edited — and after three in a row the participant is asked
      once, without accusation, whether they want to take more time. A revisit
      is never flagged: changing an answer you have already read is care, not
      haste.
      Released as r4.0.0.

  - id: D-24
    topic: First-screen framing, data-handling transparency, and the typeface
    decision: newsreader-throughout-and-privacy-on-request
    detail: >
      Researcher direction 2026-08-02.
      (a) TYPEFACE: everything is set in Newsreader. D-21 unified the interface
      on one family but picked the sans; the serif is the distinctive one and
      is the one intended. `--font-ui` remains the single switch point, so the
      accessible-font option is still a one-line change.
      (b) INTRODUCTION: the study information screen has a real title and a
      readable body, rather than one undifferentiated block whose first line
      happened to be the title. Approved wording is unchanged — only its
      arrangement on screen.
      (c) INTERSTITIAL SIZE: short information screens are set at question
      size. At body size they read as footnotes next to every screen around
      them.
      (d) DATA HANDLING: a plain-language account of what is collected, where
      it is kept, who sees it, what the secret code is for and how to withdraw,
      available from the first screen behind its own label. Every claim
      restates the approved information sheet; none of it is new permission.
      (e) STUDY LABEL: participants see a short label — the site and the year —
      not the catalogue title of the questionnaire. Researcher-set per
      fielding (`studyLabel`); the full title stays on the release for
      catalogues, exports and audit.
      (f) FIRST-SCREEN FOOTER: ethics reference and contact address, quiet, at
      the foot of the opening screen. The hairline under the Start button is
      removed — it read as a boundary the button was pressed against.
      Released as r4.0.0.

  - id: D-25
    topic: Answers that depend on earlier answers
    decision: order-cross-check-and-limit
    detail: >
      Researcher direction 2026-08-02.
      (a) ORDER: date of birth is asked immediately after the name, before
      anything that depends on it. The publish gate now refuses any release
      where a display condition, cross-check or option limit points at a
      question asked later — such a condition can never fire, so the item
      silently vanishes from every session and nobody notices until the data
      comes back short.
      (b) CROSS-CHECK: the secret code's birth-month component is checked
      against the recorded date of birth. A contradiction is still recorded —
      it is what the participant said, and the raw log is never edited — but
      the screen says so and holds there, because at that moment they can tell
      us which of the two is right and afterwards nobody can. Implemented as a
      small named vocabulary (`crossChecks`) evaluated in the engine, so a
      release can never carry a rule nothing knows how to apply.
      (c) OPTION LIMITS: the age-of-first-smartphone and age-of-first-social-
      media questions offer no age above the participant's own, derived from
      the date of birth. Every substantive option now carries the quantity it
      denotes (`value`) so the rule has something to compare. Escapes ("I'm not
      sure") are never filtered — they claim no quantity.
      Both rules fail OPEN: if the earlier answer is missing or unusable,
      nothing is blocked and nothing is hidden. A rule that cannot be evaluated
      must never become an obstacle or quietly narrow what someone can say.
      (d) TOO-FAST THRESHOLD: the flat two seconds flagged legitimate quick
      answers to short battery items and buried the real cases in noise. The
      threshold now scales with how much the screen actually asks people to
      read — words divided by a deliberately generous reading speed, floored at
      0.8s and capped at 6s — and the run before the pace prompt is 5.
      Released as r5.0.0.

  - id: D-26
    topic: Conditional flow, the name carried through, and scaled dwell help
    decision: confirm-branch-personalise
    detail: >
      Researcher direction 2026-08-02.
      (a) SOCIAL-MEDIA CONFIRMATION: "no" to social media is often a
      misunderstanding rather than an answer — people say it when they only
      watch, or when they don't count YouTube or WhatsApp. A single follow-up
      screen lists the platforms and asks once more. The original answer is
      never overwritten: the confirmation is its own variable, and the section
      shows if either says yes. A considered "no" is honoured — no app
      questions follow at all.
      (b) DEPENDENCY AUDIT: every branch, cross-check and option limit in a
      release is checked against the administered order at publish time (see
      D-25a). This is the structural guarantee behind conditional questions.
      (c) THE NAME: the first name given at the start is piped into the closing
      screen, and will feed the MyStory module so nobody is asked twice. Pipes
      now carry a fallback, so an unresolved one reads naturally instead of
      showing a raw placeholder.
      (d) DWELL HELP: the offer of help now waits until someone has had time to
      read the screen three times over, floored at 20s and capped at 90s. A
      flat 30s was far too long on a two-word question and interrupted a
      careful reader partway through a long one.
      Released as r5.0.0.

  - id: D-27
    topic: Response bands that overlap or leave gaps
    decision: disjoint-and-exhaustive
    detail: >
      Researcher direction 2026-08-02, from the fielded screens.
      The administered scales had boundaries a participant could not resolve.
      Social-media time: "1–15 minutes" and "15–30 minutes" both claimed 15;
      "30 minutes–1 hour" and "1–2 hours" both claimed an hour (A-36). Gaming:
      "Less than 5 hours" then "6-10 hours" left 5-6 hours in no band at all
      (A-9). Two people with identical use could land in different bands, and
      some people had no honest box.
      All quantity bands are now disjoint and exhaustive. Codes and legacy
      codes are untouched — this is a labelling fix, not a recoding, and the
      crosswalk is unaffected. A test reads each banded scale as a set and
      fails on any overlap, or any gap wider than the unit the band is stated
      in, so this cannot drift back.
      Also: the per-platform time question offered "0 minutes" while only being
      asked about platforms the participant had just said they use. Zero was a
      contradiction; the option now reads "I have it but barely use it", which
      is what it was presumably there to capture.
      Released as r5.0.0.

  - id: D-28
    topic: Typeface, again
    decision: inter
    detail: >
      Researcher direction 2026-08-02, with reference screenshots of Typeform.
      The interface is set in Inter — the neo-grotesque that Typeform's own
      interface uses, and the closest freely licensable equivalent. Question
      stems sit at 600 with tighter tracking, which is what makes a question
      read as a statement rather than a form label.
      This supersedes D-21 (DM Sans) and D-24a (Newsreader). The point of the
      single `--font-ui` switch point is that this was a two-line change; it
      remains the one place to swap in a dyslexia-friendly face.

  - id: D-29
    topic: Systematic QA sweep — layout, interaction wording, and age bounds
    decision: qa-pass-and-permanent-guards
    detail: >
      Researcher direction 2026-08-02: a systematic examination of the whole
      survey. Every screen type was walked at phone (390px) and iPad (1024px)
      width with automated checks for horizontal overflow, clipped content and
      tap targets under 44px, and every canonical item was read for wording
      that describes something that is not there.
      (a) HANDEDNESS ON A PHONE — the worst finding. Below 560px the spectrum
      collapsed into a vertical list, which threw away the left-to-right
      arrangement that IS the question (D-19), and rendered as a ragged
      left-aligned staircase because the flex basis was never reset for the
      column direction. Narrow screens now keep the axis horizontal: the dots
      stay on the line at 34px, the labels drop out visually but remain as the
      accessible names, the two ends are named underneath, and the chosen
      answer is read back in words.
      (b) INTERACTION WORDING — "Drag and drop the apps into the box" described
      a Qualtrics control that does not exist here; the app question is two tap
      steps that print their own labels, so the stem is now just the question.
      Consent said "Please click"; this is a tablet. Tests now fail on
      clicking, dragging, paper-form ticking, above/below references and "on a
      scale of", across every canonical form.
      (c) NUMBERS OFF THE SCALE POINTS — the KSS read "1 - Extremely alert …
      9 - Very sleepy". The digit is a paper artefact for counting by hand and
      asks a participant to hold a number and a phrase at once when the phrase
      is the measurement. Participants now see the words only; codes 1-9 are
      unchanged and the digit lives in `codeLabel` for the codebook. The stem
      "On a scale of 1 through 9 indicate how sleepy you are feeling right now"
      is now "How sleepy are you feeling right now?".
      (d) QUESTION AND EXPLANATION SEPARATED — four items (ethnicity,
      medication, social-media abstention, weekly gaming hours) carried a
      question and its explanation in one stem, set at question size. Each is
      now a stem plus a lede, as everywhere else.
      (e) TAP TARGETS — the consent tick was 20px, the smallest and most
      consequential control on screen; now 26px inside a full-row label. The
      help toggle had a 25px target; now 44px.
      (f) AGE BOUNDS — researchers set the plausible age range per study, but
      no release may exceed an absolute ceiling of 120 years, enforced in the
      schema (a release above it cannot be published) and again in the date
      control (it clamps regardless of what a release says). Belt and braces
      because a mis-set configuration must not be able to admit an implausible
      date of birth into the data.
      Not faults, checked and left alone: the sleep-priority, sleep-knowledge
      and social-media-function scales are genuinely unordered lists; ethnicity
      and gender are hard-required with a "Prefer not to say" OPTION, which is
      an answer rather than a refusal to give one.
      Released as r5.0.0.

  - id: D-30
    topic: Why answers matter, the age read back, and a last look before finishing
    decision: purpose-confirmation-and-review
    detail: >
      Researcher direction 2026-08-02.
      (a) WHY IT MATTERS: a short screen after consent and before the first
      question — the last thing read before answering starts. There are no
      right answers, only true ones; the research is about how sleep, screens
      and feelings fit together for people this age and what actually helps;
      a rushed or invented answer does not lose one number, it makes the whole
      picture slightly less true for everyone the work is meant to help.
      Deliberately short: a wall of exhortation gets skipped, and the point is
      one idea. It carries no agreement and is not a consent statement.
      (b) AGE READ BACK: entering a date of birth now answers "Great — that
      makes you 15 years old", with a control to change it. A date typed a
      digit wrong still looks like a date, so the error is invisible; an age
      does not look like you, so the mistake is obvious at the one moment it
      can still be fixed. The "(dd/mm/yyyy)" hint is dropped from the stem —
      the native picker decides the order shown, so promising a format was a
      claim the app does not control.
      (c) REVIEW BEFORE FINISHING: reaching the end no longer ends the session.
      Every question the participant actually saw is listed in order, grouped
      by section, with the answer in the words they chose — tap any row to
      change it, and editing returns straight to the list rather than walking
      the rest of the survey again. The session is completed only when they
      say they are done. Blanks are shown as blanks rather than hidden: "you
      left this one blank" is information someone may want to act on, and
      hiding it would quietly turn a skip into a decision nobody revisits.
      Branches never entered do not appear — a question you were never asked
      is not one you can have got wrong. Opening the review and every edit
      made from it are recorded (review.opened / review.edited), so a
      corrected answer is distinguishable from a first one in the paradata.
      Released as r5.0.0.

  - id: D-31
    topic: Two questions dropped, and the review moved behind the finish screen
    decision: drop-sleep-priorities-and-offer-the-review
    detail: >
      Researcher direction 2026-08-02.
      (a) DROPPED: the two sleep-priority questions — "What feels most
      important to you for getting a good night's sleep?" and "If you could
      find out more about your own sleep, what would you most like to know?" —
      are removed from the fielded questionnaire. They were the whole of
      ybm_sleep_priorities, so the module leaves the composition; the sleep
      section keeps the KSS. The module stays in the library, encoded and
      versioned, so returning it is a composition edit rather than a
      re-encoding, and its two scales stay with it.
      (b) THE REVIEW IS OFFERED, NOT IMPOSED. In D-30 the last question led to
      a list of everything answered, and only then to the thank-you. That is a
      poor reward for finishing: most people are done when they are done, and
      a wall of their own answers reads as more work. The last question now
      goes straight to "Thank you" with a quiet panel below it — "Need to
      change anything? / Go back to my answers" — and only that opens the
      list. Editing from the list returns to the list; leaving the list returns
      to the thank-you, where the hand-back button waits. The session is
      completed on reaching the finish screen and completed again on returning
      from an edit, so the completion event always follows the last change in
      the append-only log.
      Released as r6.0.0. r5.0.0 stays in releases/ untouched — a published
      release is never edited or deleted, even when superseded within the day.

  - id: D-32
    topic: Handedness — the question, the midpoint, and where the drawing sits
    decision: ask-outright-label-the-middle-centre-the-icon
    detail: >
      Researcher direction 2026-08-02. Consent is received, the BIS/BAS and
      Doomscrolling subsets are confirmed as intended, and the EHI-SF canonical
      anchor wording is confirmed — the "VERIFY before approval" flags on the
      instrument and the scale are cleared. (The LQ cutoffs are still to be
      checked when the scoring package computes them.)
      (a) THE QUESTION IS ASKED. Stems were the bare task names the paper form
      uses — "Writing", "Throwing" — which name the topic without asking
      anything. Each now asks outright: "Which hand do you write with?".
      Response options and codes are unchanged, so this is wording, not a
      different measurement.
      (b) THE MIDPOINT IS LABELLED. On narrow screens only the two ends were
      named, leaving "Both equally" as an unlabelled dot between two labelled
      extremes — which is exactly the answer least likely to be chosen by
      someone who cannot see what it means. The middle anchor is now shown
      alongside the ends. On wide screens all five labels were always visible.
      (c) THE DRAWING IS CENTRED. The object illustration sat left-aligned,
      directly above the leftmost option, on a question about which hand you
      use. Whether or not it measurably biased anything, a picture sitting over
      one end of a left-right scale is a nudge nobody intended, and centring it
      costs nothing.
      (d) THE HELP TEXT FOLLOWS. The hint used to be the question the stem now
      asks, so it said nothing new. It now says what a participant actually
      needs: think about what you would do without stopping to think, and using
      either hand is a real answer rather than a failure to choose.

  - id: D-33
    topic: Telling participants something back
    decision: score-pipes-and-handedness-feedback
    detail: >
      Researcher direction 2026-08-02: give something back as the survey goes
      along, starting with handedness, to keep people engaged early.
      Built as a general capability rather than a one-off. A new `score` pipe
      resolves any scoring output for the current session — the value or its
      band label — from the scoring definitions frozen into the release. The
      same definitions the server recomputes from, so a screen and an export
      can never disagree. Nothing is stored differently and no raw response is
      touched: this is a read of answers already given, computed for display.
      The EHI scoring definition gains a `classify` step turning the laterality
      quotient into a band. Veale (2014) cutoffs are unchanged (left ≤ -60,
      right ≥ +60); the mixed range is split further for participant-facing
      wording only, and `lq` remains the analysed variable.
      A feedback screen follows all four handedness items — never between them,
      so it cannot influence any answer it is computed from. Both pipes carry
      fallbacks, so a partial or missing answer set reads as "—" and
      "mixed-handed" rather than showing a confident-looking number that isn't
      one, or a raw placeholder.
      Where this goes next: the same mechanism will serve sleep, wellbeing and
      the rest. Those need more care than handedness — a wellbeing score read
      back mid-survey could plausibly change later answers, and some of these
      instruments are screening measures whose scores should not be presented
      to a young person without a safeguarding path. Handedness is the one that
      is genuinely safe to hand back immediately, which is why it is first and
      alone for now.
      Released as r6.0.0.

  - id: D-34
    topic: What the handedness feedback says
    decision: report-the-person-not-the-scale
    detail: >
      Researcher direction 2026-08-02. The first draft of the feedback led with
      the number and then added "Most people are somewhere near one end; being
      in the middle is genuinely uncommon, not a mistake." That is a judgement
      nobody asked for: it tells a participant their own result needs excusing,
      and it ranks one answer against everyone else's on a screen that exists
      to give something back.
      The feedback now reports what the answers say about that person and
      stops. The result leads — "Your answers suggest you're very
      right-handed" — and the number supports it underneath, with the scale
      stated plainly and no commentary on how common the result is.
      Band labels were rewritten to complete that sentence: very left-handed,
      left-handed, mostly left-handed, equally comfortable with either hand,
      mostly right-handed, right-handed, very right-handed. Veale (2014)
      cutoffs are still unchanged and `lq` is still the analysed variable —
      this is the wording read back to a participant, not the classification
      used for analysis.
      Two tests hold the line: every band must complete the sentence it is
      dropped into, and no instrument text may say a result is normal,
      unusual, uncommon or a mistake.

  - id: D-35
    topic: Where the answers go — the dataset, the researcher view and BIDS
    decision: raw-logs-are-the-record-everything-else-is-derived
    detail: >
      Researcher direction 2026-08-03: one database reachable quickly through
      the web, summary global measures, a filter on every column, and the same
      data also written into a traditional BIDS-style folder structure, with
      longitudinal capture treated as the point of the exercise rather than a
      later addition.
      The shape adopted is a projection, not a store. The record is the
      device's append-only event log, kept exactly as it arrived; the dataset
      (participants, sessions, responses, scores) is derived from those logs on
      every load and never persisted. A scoring correction or a fix in the
      reader is therefore a new build, applied to the whole study at once, with
      no migration and no possibility of two versions of the truth sitting in
      one file. It costs a second at start-up.
      Three rules the types enforce rather than merely document: raw is raw —
      skips and declines are first-class statuses, and nothing derived is ever
      written back into a response row; derived is separate and regenerable,
      recording which scoring definition produced it; identifiers live apart —
      names and dates of birth are not in the dataset shape at all, and what
      links a person across waves is the derived participant code.
      Longitudinal linkage is the highest-risk code in the platform, because a
      wrong join silently merges two children's data and nobody ever sees it.
      A sitting whose secret code is incomplete is HELD BACK, never guessed at:
      it is stored, reported on screen, and left out of every count until a
      human resolves it. Sittings are read back through the release they were
      collected under, matched by content hash, so wave 1 under r5 and wave 3
      under r7 are not silently treated as the same instrument.
      Wave-by-wave comparisons in the researcher view use the returning sample
      only. Comparing a later wave against everyone who ever did a first one
      mixes change with attrition, and the two are not separable afterwards.
      The BIDS export is BIDS-style, deliberately: a survey-only dataset is not
      a valid BIDS dataset on its own, but following the layout means the EEG
      drops into the per-subject session directories beside it later without
      anything moving. `n/a` for missing, never a blank; a sidecar dictionary
      for every data file; the release hash in the dataset description.
      Until sync exists the route off an iPad is a file, written from a
      handover panel behind a deliberate gesture on the build line, and the
      researcher view is a laptop tool holding real answers — hence storage per
      browser profile, demonstration data filed under sites beginning "DEMO",
      and clearing everything one click away.

  - id: D-36
    topic: Where the server runs, and who controls the accounts
    decision: self-hosted-provider-independent-with-own-idp
    detail: >
      Researcher direction 2026-08-03, superseding the hosting half of D-12:
      the platform must run completely independently of University of Leeds
      infrastructure, and the researcher must be able to control who has admin
      rights directly, without asking anyone.
      Adopted: a single rented Linux host (Hetzner CX32 in the EU recommended,
      DigitalOcean London equivalent) running four containers — Postgres 16,
      Keycloak, the API, and Caddy for automatic TLS. Nothing in the core path
      depends on a service only one provider sells, so the study can move host
      without a rebuild.
      Sign-in is OIDC against the stack's own Keycloak. Three realm roles —
      owner, researcher, analyst — carry a fixed capability set, and adding or
      removing a person is done in the Keycloak console alone: the API keeps no
      user list of its own, so there is nothing to drift out of step. Enrolling
      an iPad and reading an identifier are owner-only. A signed-in person with
      no role is told so plainly rather than shown an empty study, because
      silence looks like a bug and invites a workaround.
      iPads authenticate with an enrolment token issued once by an owner and
      stored only as a SHA-256 hash; a lost device is revoked and refused at
      the next sync. Participants never authenticate at all.
      Consequences recorded honestly in docs/12: hosting it yourself changes
      who operates the server, not who is responsible for the data. Leeds
      remains the data controller for Leeds-sponsored research, the hosting
      provider becomes a processor to name in the DPIA, and PSCETHS-1449
      describes a data flow that ends on the iPads — syncing to a server needs
      an amendment. Until that is approved the file-based handover route stays
      the one used for real fieldwork; the server runs on synthetic data.
