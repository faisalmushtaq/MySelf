# This file is used to configure the micro-narratives Streamlit app.
#
# To use it, make a copy of this file, keep the same structure within and replace the existing entries with ones appropriate for your own app.
#
# This file uses the TOML format. For guidance on string formatting within TOML files, see the documentation at https://toml.io/
#
# The config file is specified by one of the following. If multiple options are available, the first is used:
# 1. Run the app with `streamlit run app.py path-to-file/config-file-name.toml`
# 2. Add the line `CONFIG_FILE = 'path-to-file/config-file-name.toml'` to your Streamlit secrets configuration.
# 3. If none of the options above is used, the app shows the config page, where you can paste a config or insert the default `configs/example_social.toml` example.
#
# In principle, anything that is set in quotes (either via " or """) in this file can be changed by you. 
#
# The story/logic for setting up the chatbot is as follows: there is one major interviewer or counselor (called "persona" under the section setting up the data collection bot) whose aim is to collect stories. 
# This interviewer engages three other "helper" interviewers (which, in this example, are called "formal", "sibling", and "goth" under the section setting up the data extraction and story generation bots).
# Those helper interviewers are tasked to collect stories and represent them with a certain voice, e.g., the voice of an edgy and cheeky, but respectful goth, or the voice of an empathetic and youth-friendly, but formal developmental psychologist.  
# You can set up different personas in whichever way you like/need, including choosing names for them.
# 
# All three personas must be provided under `[summaries.personas]' in the data extraction and story generation bots section. Additional personas will not be used.
#
# The one-shot example provided for the LLM at the end of this file is the same for all personas.

### Select the version of the LLM to be used
# Recommended (in order of increasing cost): gpt-3.5-turbo-1106, gpt-4o
# Specifying the model is optional; by default, gpt-4o will be used
model = "gpt-4o"

### Quality control
# If true, the app computes quality-control metrics after the chat finishes.
# If the interaction is flagged, the app stops before scenario generation.
# If this setting is omitted, the code defaults to false.
quality_control_flagging = true

### This is the text that will be shown on the first page

[consent]

intro_and_consent = """## Exploring children's perceptions of brain health

Hello!

You are going to chat with a chatbot for a few minutes, in the same way you might interact with ChatGPT or other AI software.

The chatbot will ask you some questions about your brain and what it is like living with your brain.

Everyone has a different brain, and there are no right or wrong answers.

Please discuss the questions with your group before typing your answers. You may share stories and examples, but please do not include anyone's name or personal information.

If you do not understand a question, please ask the researcher for help.

After answering the questions, the chatbot will generate three short stories about your brain based on your responses. As a group, you will choose the story that relates most to you, and you will have the opportunity to edit it before submitting.

To continue, please confirm that you have read and understood this information.
"""

### Participant settings
[participant]

require_participant_id = true
editable_participant_id = true
text = "Please enter your group name below."

###  This section sets up the data collection bot. ###
# You can put in as many questions as you like
# If you include "{previous_scenario}" in the intro text below, the app will try to fetch
# the participant's latest previous final scenario from the configured read database.

[collection]

persona = """
You are a friendly chatbot speaking with children about their brains and brain health.

Use simple, warm, encouraging, and age-appropriate language.

Explain that everyone has a different brain and that there are no right or wrong answers.

Your purpose is to help children describe their experiences and tell stories about what it is like living with their brain.

Ask the questions in the provided order.

Ask only one question or follow-up prompt at a time.

Do not combine several prompts into one message.

When asking about an experience, gently encourage the participant to include what happened, when it happened, where they were, who they were with, what they were thinking, and how they felt.

Do not judge, correct, diagnose, advise, or interpret the participant's answers.

Do not introduce medical conditions or diagnostic labels unless the participant mentions them first.

Keep the conversation focused on the participant's own brain, experiences, thoughts, feelings, and stories.
"""

language_type = "Use empathetic and youth-friendly language while maintaining a descriptive tone."

intro = """
Hi! I am a ChatBot learning about children’s brains. Everyone has a different brain and there are no right or wrong answers. I would love to hear some stories about what it is like living with your brain. I will ask you some questions to help you tell your story!
"""

questions = [
"If your brain was a character in a story, what would it be like? For example, strong, bouncy, funny, or moody.",
"Why have you described your brain this way? Do you have any specific stories you’d like to share?",
"Can you tell me a little more? What describing words would you use to tell me about how your brain normally is?",
"Thank you. Can you tell me about a time when you felt really proud of something your brain helped you do? For example, your brain might have helped you pass a difficult maths test.",
"What happened?",
"When did it happen?",
"Where were you?",
"Who were you with?",
"What were you thinking at the time?",
"Can you think of a time when your brain did not do what you wanted it to do? What happened?",
"What were you trying to do?",
"What happened next?",
"How did you feel?",
"Did anyone help you? If so, who?"
]


topic_restriction = """
Keep the conversation focused on children's perceptions and experiences of their own brains and brain health.

The chatbot may ask about how the participant describes their brain, times when their brain helped them, times when their brain did not do what they wanted, and the thoughts and feelings connected to those experiences.

Do not introduce unrelated topics, diagnoses, medical advice, or diagnostic labels unless the participant mentions them first.
"""

###  This section sets up the data extraction and story generation bots. ###
[summaries]

[summaries.questions]

what = "How does the participant describe their brain and its usual characteristics?"
context = "What specific experiences or stories did the participant share about their brain?"
reaction = "What did the participant think and feel during these experiences?"
outcome = "How did the participant's brain help them, challenge them, or affect what happened next?"

[summaries.personas]

formal = """
You are a warm and thoughtful children's storyteller.

Create a short first-person story about the participant's brain using only the experiences, descriptions, thoughts, and feelings they shared.

Use simple, clear, age-appropriate language.

The story should sound as though the participant is describing their own brain and experiences.

Do not add diagnoses, interpretations, advice, names, or information that the participant did not provide.
"""

sibling = """
You are a friendly older sibling helping a child tell a story about their brain.

Create a short first-person story using natural, relaxed, child-friendly language.

Reflect how the participant described their brain, something their brain helped them do, and a time when their brain did not do what they wanted.

Stay closely grounded in the participant's answers.

Do not add diagnoses, advice, names, or details that were not shared.
"""

goth = """
You are a creative but respectful children's story writer.

Create a short first-person story that brings the participant's description of their brain to life.

Use vivid but simple language and reflect the participant's actual experiences, thoughts, and feelings.

The story may use the participant's description of their brain as a character, but it must remain faithful to what they said.

Do not add medical labels, diagnoses, advice, names, or invented personal details.
"""


# This is the one-shot example, separated into answers & final scenario

[example]

conversation = """
Question: If your brain was a character in a story, what would it be like?
Answer: "My brain would be a bouncy character because it is always jumping between different ideas."

Question: Why have you described your brain this way? Do you have any specific stories you'd like to share?
Answer: "When I am doing my homework, I sometimes start thinking about a game or something that happened at school."

Question: What describing words would you use to tell me about how your brain normally is?
Answer: "Bouncy, creative, fast, and sometimes distracted."

Question: Can you tell me about a time when you felt really proud of something your brain helped you do?
Answer: "My brain helped me remember all my lines for a school play."

Question: What happened?
Answer: "I went on stage and remembered the whole scene without forgetting anything."

Question: When did it happen?
Answer: "It happened last term."

Question: Where were you?
Answer: "I was in the school hall."

Question: Who were you with?
Answer: "I was with my classmates, teachers, and my family was watching."

Question: What were you thinking at the time?
Answer: "I was nervous at first, but then I thought that I knew what to do."

Question: Can you think of a time when your brain did not do what you wanted it to do?
Answer: "Sometimes my brain will not concentrate when I am trying to read."

Question: What were you trying to do?
Answer: "I was trying to finish a chapter of my book."

Question: What happened next?
Answer: "I had to read the same page several times."

Question: How did you feel?
Answer: "I felt annoyed and a bit tired."

Question: Did anyone help you? If so, who?
Answer: "My teacher helped me take a short break and then try again."
"""

scenario = """
My brain is like a bouncy character because it is always jumping between different ideas. \
It can be creative and fast, but sometimes it gets distracted. \
One time, my brain helped me remember all my lines for a school play. \
I was standing in the school hall with my classmates while my teachers and family watched. \
I felt nervous at first, but then I remembered what to say and felt proud of myself. \
Sometimes my brain does not do what I want it to do, especially when I am trying to read. \
I may have to read the same page several times, which can make me feel annoyed and tired. \
Taking a short break and getting help from my teacher can help my brain get ready to try again.
"""